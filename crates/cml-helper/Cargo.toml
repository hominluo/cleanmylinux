[package]
name = "cml-helper"
description = "CleanMyLinux privileged helper — runs a fixed whitelist of root-only cleanup ops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "cleanmylinux-helper"
path = "src/main.rs"

[dependencies]
cml-core = { path = "../cml-core" }
serde_json.workspace = true
anyhow.workspace = true

[package.metadata.deb]
name = "cleanmylinux-common"
depends = "polkit"
section = "utils"
priority = "optional"
extended-description = "Shared engine and privileged helper for CleanMyLinux. Provides the polkit-mediated helper used by the GNOME and KDE frontends."
assets = [
    ["target/release/cleanmylinux-helper", "usr/libexec/cleanmylinux-helper", "755"],
    ["../../data/polkit/io.cleanmylinux.helper.policy", "usr/share/polkit-1/actions/", "644"],
]
